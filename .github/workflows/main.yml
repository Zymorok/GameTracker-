name: Сборка и пуш в Docker Hub

on:
  push:
    branches: ["master", "main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Загрузить код из репозитория
        uses: actions/checkout@v3

      - name: 2. Логин в Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 3. Собрать и отправить образ в Docker Hub
        uses: docker/build-push-action@v2
        with:
          context: .
          file: GameTracker/GameTracker/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/gametracker:v${{ github.run_number }}
