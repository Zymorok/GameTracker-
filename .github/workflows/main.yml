name: Сборка и пуш в Docker Hub

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Загрузить код из репозитория
        uses: actions/checkout@v4

      - name: 2. Показать файлы
        run: find . -maxdepth 5 -type f

      - name: 3. Логин в Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 4. Собрать и отправить образ в Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/gametracker:latest
            ${{ secrets.DOCKER_USERNAME }}/gametracker:v${{ github.run_number }}
